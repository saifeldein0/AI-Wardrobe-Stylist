<style>
  html, body { margin:0; padding:0; background:#FDFAFB; -webkit-text-size-adjust:100%; }
  #root { min-height:100vh; }
  .boot { font-family:system-ui,sans-serif; color:#7C8480; padding:48px 24px; text-align:center; font-size:15px; }
  .cog { position:fixed; top:14px; right:14px; z-index:60; border:0; cursor:pointer; border-radius:999px;
    background:#fff; color:#071108; font-family:'Nunito',system-ui,sans-serif; font-weight:800; font-size:13px;
    padding:9px 16px; box-shadow:0 2px 14px rgba(140,95,105,.22); }
  .cog:hover { box-shadow:0 4px 20px rgba(140,95,105,.32); }
  .veil { position:fixed; inset:0; z-index:70; background:rgba(7,17,8,.34); display:flex; align-items:center;
    justify-content:center; padding:18px; overflow-y:auto; }
  .sheet { background:#fff; border-radius:28px; padding:28px; width:min(560px,100%); box-shadow:0 20px 60px rgba(7,17,8,.3);
    font-family:'Nunito',system-ui,sans-serif; color:#071108; }
  .sheet h2 { font-family:'Fraunces',Georgia,serif; font-size:26px; margin:0 0 6px; font-weight:700; }
  .sheet p { color:#5B6360; font-size:14.5px; line-height:1.6; margin:0 0 18px; font-weight:500; }
  .sheet label { display:block; font-weight:800; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em;
    color:#7C8480; margin-bottom:6px; }
  .sheet input { width:100%; box-sizing:border-box; border:2px solid #F3E6EA; border-radius:16px; padding:12px 15px;
    font-family:'Nunito',system-ui,sans-serif; font-size:14px; font-weight:500; background:#FFFCFD; color:#071108; }
  .sheet input:focus { outline:none; border-color:#F0B7B3; }
  .sheet .warn { background:#FDEBEF; border-radius:16px; padding:13px 16px; font-size:13px; line-height:1.55;
    font-weight:600; margin:18px 0; }
  .sheet .row { display:flex; gap:9px; flex-wrap:wrap; margin-top:20px; }
  .sheet button { border:0; cursor:pointer; border-radius:999px; font-family:'Nunito',system-ui,sans-serif;
    font-weight:800; font-size:14px; padding:12px 22px; color:#071108;
    background:linear-gradient(115deg,#FBE3EA,#F0B7B3 70%,#EDAFAE); box-shadow:0 3px 14px rgba(240,183,179,.55); }
  .sheet button.q { background:#fff; box-shadow:inset 0 0 0 2px #F3E6EA; }
  .sheet a { color:#A85A66; }
</style>

<body>
<div id="root"><div class="boot">Loading your closet…</div></div>

<script>
window.addEventListener("error", function (e) {
  var r = document.getElementById("root");
  if (r && r.querySelector(".boot")) {
    r.innerHTML = '<div class="boot"><b>Something failed to start.</b><br><br>' +
      String(e.message || e.error || "Unknown error").replace(/</g, "&lt;") +
      '<br><br>Open the browser console for the full trace.</div>';
  }
});
</script>

<script>
/* ---- local storage shim: same API the app already speaks, backed by IndexedDB ----
   IndexedDB instead of localStorage because thumbnails are far past the 5MB
   localStorage ceiling. Quota here is typically gigabytes.                        */
(function () {
  var DB = "wardrobe-db", STORE = "kv";
  function open() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(STORE); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function op(mode, fn) {
    return open().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, mode);
        var req = fn(t.objectStore(STORE));
        req.onsuccess = function () { res(req.result); };
        req.onerror = function () { rej(req.error); };
      });
    });
  }
  window.storage = {
    get: function (k) {
      return op("readonly", function (s) { return s.get(k); }).then(function (v) {
        if (v === undefined) throw new Error("not found: " + k);
        return { key: k, value: v };
      });
    },
    set: function (k, v) {
      return op("readwrite", function (s) { return s.put(v, k); }).then(function () { return { key: k, value: v }; });
    },
    "delete": function (k) {
      return op("readwrite", function (s) { return s["delete"](k); }).then(function () { return { key: k, deleted: true }; });
    },
    list: function (prefix) {
      return op("readonly", function (s) { return s.getAllKeys(); }).then(function (keys) {
        return { keys: keys.filter(function (k) { return !prefix || String(k).indexOf(prefix) === 0; }) };
      });
    }
  };
})();
</script>

<script>
const {
  useState,
  useEffect,
  useRef,
  useMemo
} = React;
const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap');

.wx * { box-sizing: border-box; }
.wx {
  --paper:#FDFAFB; --card:#FFFFFF; --petal:#F7D6E0; --blush:#F0B7B3; --sky:#AED9E0;
  --ink:#071108; --muted:#7C8480; --quiet:#5B6360; --hair:#F3E6EA;
  --soft:0 1px 2px rgba(140,95,105,.05), 0 8px 22px rgba(140,95,105,.08);
  --lift:0 2px 5px rgba(140,95,105,.07), 0 18px 40px rgba(140,95,105,.13);
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--ink); min-height:100vh; padding:0 0 90px;
  background:
    radial-gradient(880px 420px at 8% -10%, rgba(247,214,224,.95), transparent 62%),
    radial-gradient(800px 400px at 95% 0%, rgba(174,217,224,.85), transparent 60%),
    radial-gradient(720px 420px at 52% 108%, rgba(240,183,179,.6), transparent 64%),
    var(--paper);
}
.wx .eyebrow { font-weight:800; text-transform:uppercase; letter-spacing:.11em; font-size:10px; }

/* header */
.wx-head { padding:36px 24px 18px; }
.wx-mark { font-family:'Fraunces',Georgia,serif; font-weight:700; font-size:42px; letter-spacing:-.02em; line-height:1.12; }
.wx-mark em { font-style:normal; position:relative; z-index:0; padding:0 3px; }
.wx-mark em::after { content:''; position:absolute; left:0; right:0; bottom:.04em; height:.42em; z-index:-1;
  background:linear-gradient(96deg,var(--blush),var(--petal)); border-radius:999px 999px 999px 4px; transform:rotate(-.7deg); }
.wx-sub { color:var(--quiet); font-size:15px; margin-top:12px; font-weight:500; }
.wx-ledger { display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; }
.wx-pill { background:var(--card); border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700;
  box-shadow:var(--soft); display:inline-flex; align-items:center; gap:7px; }
.wx-dot { width:8px; height:8px; border-radius:50%; display:inline-block; flex:0 0 auto; }

/* nav */
.wx-nav { display:flex; gap:7px; padding:6px 24px 4px; flex-wrap:wrap; }
.wx-tab { border:0; background:transparent; font-family:'Nunito',sans-serif; font-weight:700; font-size:14.5px;
  color:var(--muted); padding:11px 20px; border-radius:999px; cursor:pointer; }
.wx-tab:hover { color:var(--ink); background:rgba(255,255,255,.7); }
.wx-tab[data-on="1"] { background:var(--card); color:var(--ink); box-shadow:var(--soft); }
.wx-tab:focus-visible { outline:3px solid var(--blush); outline-offset:2px; }

.wx-body { padding:16px 24px 24px; max-width:1120px; margin:0 auto; }

/* buttons */
.wx-btn { font-family:'Nunito',sans-serif; font-weight:800; font-size:14px; padding:12px 22px; border-radius:999px;
  cursor:pointer; border:0; color:var(--ink); background:linear-gradient(115deg,#FBE3EA,#F0B7B3 70%,#EDAFAE);

const SHARD_MAX = 3400000;

/* ------------------- sharded local image storage ------------------- */
/* Metadata lives in one small key. Thumbnails are spread across as many
   ~3.4MB shards as needed, so the closet is no longer capped near 150. */

const imageStore = {
  shards: [],
  async load() {
    let keys = [];
    try {
      const r = await window.storage.list(IMG_PREFIX);
      keys = r && Array.isArray(r.keys) ? r.keys : [];
    } catch (e) {
      keys = [];
    }
    const shards = [];
    for (const key of keys) {
      try {
        const g = await window.storage.get(key);
        const raw = g && g.value ? g.value : "{}";
        shards.push({
          key,
          map: JSON.parse(raw),
          size: raw.length
        });
      } catch (e) {/* skip an unreadable shard rather than lose the rest */}
    }
    this.shards = shards;
    return this.all();
  },
  all() {
    const out = {};
    for (const s of this.shards) Object.assign(out, s.map);
    return out;
  },
  nextKey() {
    const used = new Set(this.shards.map(s => s.key));
    let n = 0;
    while (used.has(IMG_PREFIX + n)) n++;
    return IMG_PREFIX + n;
  },
  async putMany(entries) {
    const touched = new Set();
    for (const {
      id,
      b64
    } of entries) {
      const cost = b64.length + id.length + 8;
      let shard = this.shards.find(s => s.size + cost < SHARD_MAX);
      if (!shard) {
        shard = {
          key: this.nextKey(),
          map: {},
          size: 2
        };
        this.shards.push(shard);
      }
      shard.map[id] = b64;
      shard.size += cost;
      touched.add(shard);
    }
    for (const s of touched) await window.storage.set(s.key, JSON.stringify(s.map));
  },
  async remove(ids) {
    const set = new Set(ids);
    for (const s of this.shards) {
      let hit = false;
      for (const id of Object.keys(s.map)) if (set.has(id)) {
        delete s.map[id];
        hit = true;
      }
      if (hit) {
        const json = JSON.stringify(s.map);
        s.size = json.length;
        await window.storage.set(s.key, json);
      }
    }
  }
};

/* ----------------------------- utilities ----------------------------- */

function shrink(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("That file couldn't be read."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That doesn't look like an image."));
      img.onload = () => {
        let w = img.width,
          h = img.height;
        const s = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * s));
        h = Math.max(1, Math.round(h * s));
        const c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Crop one item out of the original photo using the model's bounding box,
// so each card shows the piece rather than seven copies of the same photo.
function cropFromBox(file, box, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("That file couldn't be read."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That doesn't look like an image."));
      img.onload = () => {
        const W = img.width,
          H = img.height;
        let sx = 0,
          sy = 0,
          sw = W,
          sh = H;
        if (Array.isArray(box) && box.length === 4) {
          const [y0, x0, y1, x1] = box.map(Number);
          if ([y0, x0, y1, x1].every(n => isFinite(n)) && y1 > y0 && x1 > x0) {
            // a little padding so the piece isn't cut flush to the edge
            const padY = (y1 - y0) * 0.06,
              padX = (x1 - x0) * 0.06;
            const Y0 = Math.max(0, y0 - padY),
              X0 = Math.max(0, x0 - padX);
            const Y1 = Math.min(1000, y1 + padY),
              X1 = Math.min(1000, x1 + padX);
            sy = Y0 / 1000 * H;
            sx = X0 / 1000 * W;
            sh = (Y1 - Y0) / 1000 * H;
            sw = (X1 - X0) / 1000 * W;
          }
        }
        // letterbox into a 4:5 frame so the grid stays even and nothing is squashed
        const targetRatio = 4 / 5;
        let cw = sw,
          ch = sh;
        if (cw / ch > targetRatio) ch = cw / targetRatio;else cw = ch * targetRatio;
        const cx = sx + sw / 2 - cw / 2,
          cy = sy + sh / 2 - ch / 2;
        const scale = Math.min(1, maxDim / Math.max(cw, ch));
        const outW = Math.max(1, Math.round(cw * scale));
        const outH = Math.max(1, Math.round(ch * scale));
        const c = document.createElement("canvas");
        c.width = outW;
        c.height = outH;
        const ctx = c.getContext("2d");
        ctx.imageSmoothingQuality = "high";
        ctx.fillStyle = "#F7F2F4";
        ctx.fillRect(0, 0, outW, outH);
        ctx.drawImage(img, cx, cy, cw, ch, 0, 0, outW, outH);
        resolve(c.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Claude on this PC: the native app window relays requests to the Claude Code
   command line, which runs under the owner's Claude subscription. Images are

const wxBridge = { pending: {}, seq: 0, wired: false };
function wxWireBridge() {
  if (wxBridge.wired || !(window.chrome && window.chrome.webview)) return;
  wxBridge.wired = true;
  window.chrome.webview.addEventListener("message", ev => {
    const t = typeof ev.data === "string" ? ev.data : "";
    if (t.slice(0, 4) !== "RES\n") return;
    const i1 = t.indexOf("\n", 4);
    const i2 = t.indexOf("\n", i1 + 1);
    const id = t.slice(4, i1);
    const status = t.slice(i1 + 1, i2);
    const text = t.slice(i2 + 1);
    const pr = wxBridge.pending[id];
    if (!pr) return;
    delete wxBridge.pending[id];
    clearTimeout(pr.timer);
    if (status === "OK" && text.trim()) pr.resolve(text.trim());
    else pr.reject(new Error(text.trim() || "Claude on this PC returned nothing. Is Claude Code installed and signed in?"));

}
async function askClaudeLocal(messages, o) {
  if (!(window.chrome && window.chrome.webview)) throw new Error("\u201CClaude on this PC\u201D only works inside the Wardrobe app window. Pick Gemini in Settings when using a browser.");
  wxWireBridge();
  const imgs = [];
  let prompt = o.system ? "SYSTEM INSTRUCTIONS:\n" + o.system + "\n\n" : "";
  for (const m of messages) {
    if (typeof m.content === "string") { prompt += m.content + "\n"; continue; }
    for (const b of m.content) {
      if (b.type === "text") prompt += b.text + "\n";
      else if (b.type === "image" && b.source && b.source.data) {
        imgs.push(b.source.data);
        prompt += "[Photo " + imgs.length + " is saved beside this prompt - open and read it.]\n";
      }
    }
  }
  if (o.search) prompt += "\nYou may search the web where the task calls for it.\n";
  const id = "r" + (++wxBridge.seq) + "x" + Date.now();
  const payload = "REQ\n" + id + "\n" + imgs.length + "\n" + imgs.join("\n") + (imgs.length ? "\n" : "") + prompt;
  return new Promise((resolve, reject) => {
    wxBridge.pending[id] = {
      resolve, reject,
      timer: setTimeout(() => {
        delete wxBridge.pending[id];
        reject(new Error("Claude on this PC didn't answer within 3 minutes. Check that Claude Code is installed and signed in, or switch to Gemini in Settings."));

// Free-tier keys are capped per minute. A 429 tells us how long to wait,
// so wait it out rather than losing the upload.
function retryDelayMs(err) {
  const msg = String((err && err.message) || "");
  const m = msg.match(/retry in ([\d.]+)s/i);
  if (m) return Math.ceil(parseFloat(m[1]) * 1000) + 1500;
  return /quota|rate limit|429|RESOURCE_EXHAUSTED/i.test(msg) ? 22000 : 0;
}

async function askWithRetry(messages, opts, onWait) {
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      return await askClaude(messages, opts);
    } catch (err) {
      const wait = retryDelayMs(err);
      // a daily cap will not clear in seconds — surface it straight away
      if (!wait || /per day|daily/i.test(String(err.message || ""))) throw err;
      if (attempt === 3) throw err;
      if (onWait) onWait(Math.round(wait / 1000));
      await sleep(wait);
    }
  }
}
